# The game's own Wi-Fi network, hosted by the QNX Pi (qnx/README.md). Sourced by
# qnx/ap/gm-net.sh on the Pi and by qnx/ap.sh, scripts/wifi.sh and scripts/game.sh on
# the Mac. The password is not here: it is GM_WIFI_PASSWORD in .env.local (gitignored).
#
# Not 172.20.10.0/28: that is the iPhone's hotspot network, which the Mac still uses
# for internet over USB, and the same subnet on two interfaces would send traffic for
# the Pi to the phone.
SSID=gamemaster
FREQ=2437                   # 2.4 GHz, channel 6
IFACE=bcm0                  # the Pi's Wi-Fi
PI_ADDR=10.77.0.1
MAC_ADDR=10.77.0.2          # set by hand on the Mac (scripts/wifi.sh): its Wi-Fi MAC is private per network
NETMASK=255.255.255.0
POOL=10.77.0.100-10.77.0.199
ROBOT_MAC=7c:4f:ad:af:ca:6c  # the StackChan's Wi-Fi (qnx/led.sh: the status light turns green when it is on the network)
TABLE_PORT=8090             # the brain's Table for the referee
TRIAL=300                   # seconds a by-hand trial lasts unless confirmed
PROBATION=900               # seconds a new boot setup has to be confirmed before it undoes itself
UPLINK_WAIT=60              # seconds the uplink's boot waits for the iPhone hotspot before it runs the access point alone on bcm0
